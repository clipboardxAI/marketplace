<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClipboxAI · Action Marketplace</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --fg:#e8eaed; --muted:#9aa0a6; --accent:#5b8cff; --line:#2a2e37; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--fg); }
  header { padding:40px 24px 16px; text-align:center; }
  header h1 { margin:0 0 8px; font-size:26px; }
  header p { margin:0; color:var(--muted); font-size:14px; }
  .langbar { display:flex; justify-content:center; align-items:center; gap:8px; margin:14px 0 0; }
  .langbar label { font-size:13px; color:var(--muted); }
  .langbar select { background:var(--card); color:var(--fg); border:1px solid var(--line);
                    border-radius:8px; padding:6px 10px; font-size:13px; }
  .wrap { max-width:1080px; margin:0 auto; padding:16px 24px 64px; }
  .cats { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:20px 0 28px; }
  .cat { padding:6px 14px; border:1px solid var(--line); border-radius:999px; cursor:pointer;
         font-size:13px; color:var(--muted); background:var(--card); transition:.15s; }
  .cat:hover { color:var(--fg); }
  .cat.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px;
          display:flex; flex-direction:column; gap:10px; }
  .card .top { display:flex; align-items:center; gap:10px; }
  .card .ic { font-size:22px; }
  .card h3 { margin:0; font-size:16px; }
  .card .by { font-size:12px; color:var(--muted); }
  .card .desc { font-size:13px; color:var(--muted); min-height:34px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .tag { font-size:11px; color:var(--muted); background:#22262f; padding:3px 8px; border-radius:999px; }
  .prompt { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#b9c0c9;
            background:#11141a; border:1px solid var(--line); border-radius:8px; padding:8px;
            max-height:90px; overflow:auto; white-space:pre-wrap; }
  .row { display:flex; align-items:center; justify-content:space-between; margin-top:4px; }
  .ver { font-size:11px; color:var(--muted); }
  button.install { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:7px 14px;
                   font-size:13px; cursor:pointer; }
  button.install:hover { filter:brightness(1.08); }
  .hint { text-align:center; color:var(--muted); font-size:13px; margin-top:28px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>ClipboxAI · Action Marketplace</h1>
  <p>Community-curated AI actions for your clipboard. Click “Install” to open the app and add it.</p>
  <div class="langbar">
    <label for="lang">Language:</label>
    <select id="lang"></select>
  </div>
</header>
<div class="wrap">
  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"></div>
  <p class="hint">Nothing happens? Install <a href="https://github.com/w3cub/clipboxai" target="_blank">ClipboxAI</a> first.</p>
</div>
<script>
const SCHEME = "clipboxai://install?action=";
let CATS = [], ACTIONS = [], active = null, lang = "en", LANGS = ["en"], BASE = null;

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// Localized field lookup: prefer the active locale's override, fall back to the
// canonical (English) base value. `locales` is merged in from marketplace.<lang>.json.
function locAction(a, field){
  if (lang !== "en" && a.locales && a.locales[lang] && a.locales[lang][field] != null) return a.locales[lang][field];
  return a[field];
}
function locCat(c){
  if (lang !== "en" && c.locales && c.locales[lang] && c.locales[lang].name) return c.locales[lang].name;
  return c.name;
}

function clone(o){ return JSON.parse(JSON.stringify(o)); }

// Merge one language pack's overrides (marketplace.<lang>.json) onto the base
// catalog. Pack action keys are "<category>/<id>".
function applyPack(pack, l){
  const pa = pack.actions || {};
  for (const a of ACTIONS) {
    const key = a.category + "/" + a.id;
    if (pa[key]) { a.locales = a.locales || {}; a.locales[l] = pa[key]; }
  }
  const pc = pack.categories || {};
  for (const c of CATS) {
    if (pc[c.id]) { c.locales = c.locales || {}; c.locales[l] = pc[c.id]; }
  }
}

// Switch language: reset to the English base, then overlay the chosen pack.
async function setLang(l){
  lang = l;
  if (!BASE) return;
  CATS = clone(BASE.categories);
  ACTIONS = clone(BASE.actions);
  if (l !== "en") {
    try {
      const pack = await fetch("./marketplace." + l + ".json").then(r => r.json());
      applyPack(pack, l);
    } catch(e) { /* no pack available; show English base */ }
  }
  renderCats(); renderGrid();
}

function renderLang(){
  const sel = document.getElementById('lang');
  sel.innerHTML = "";
  LANGS.forEach(l => {
    const o = document.createElement('option');
    o.value = l; o.textContent = l;
    if (l === lang) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = () => { setLang(sel.value); };
}

function renderCats(){
  const el = document.getElementById('cats');
  el.innerHTML = "";
  const all = document.createElement('div');
  all.className = 'cat' + (active===null?' active':'');
  all.textContent = 'All';
  all.onclick = () => { active=null; renderCats(); renderGrid(); };
  el.appendChild(all);
  CATS.forEach(c => {
    const d = document.createElement('div');
    d.className = 'cat' + (active===c.id?' active':'');
    d.textContent = locCat(c);
    d.onclick = () => { active=c.id; renderCats(); renderGrid(); };
    el.appendChild(d);
  });
}

function renderGrid(){
  const el = document.getElementById('grid');
  el.innerHTML = "";
  ACTIONS.filter(a => active===null || a.category===active).forEach(a => {
    const cat = CATS.find(c => c.id===a.category);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="top">
        <div class="ic">${esc(a.icon || '✨')}</div>
        <div>
          <h3>${esc(locAction(a, 'name'))}</h3>
          <div class="by">by ${esc(a.author)}</div>
        </div>
      </div>
      <div class="desc">${esc(locAction(a, 'description'))}</div>
      <div class="tags">${(locAction(a, 'tags')||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>
      <div class="prompt">${esc(locAction(a, 'prompt'))}</div>
      <div class="row">
        <span class="ver">v${esc(a.version)} · ${esc(cat?locCat(cat):'')}</span>
        <button class="install">Install</button>
      </div>`;
    card.querySelector('button.install').onclick = () => {
      window.location.href = SCHEME + encodeURIComponent(a.id);
    };
    el.appendChild(card);
  });
  if(!el.children.length){
    el.innerHTML = '<p style="color:var(--muted);grid-column:1/-1;text-align:center;">No actions in this category yet.</p>';
  }
}

fetch('./marketplace.json')
  .then(r => r.json())
  .then(d => {
    BASE = d;
    // Languages come from the catalog's `languages` list (the separate packs).
    LANGS = (d.languages && d.languages.length) ? ["en", ...d.languages] : ["en"];
    renderLang();
    setLang("en");
  })
  .catch(e => {
    document.getElementById('grid').innerHTML =
      '<p style="color:var(--muted);grid-column:1/-1;text-align:center;">Failed to load the catalog. Make sure it is deployed to GitHub Pages / Cloudflare.</p>';
  });
</script>
</body>
</html>
